
name: Build DPG Simulator Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Godot
        run: |
          sudo apt-get update
          sudo apt-get install -y godot3-server godot3-export

      - name: Check project files
        run: |
          echo "Checking exported game files"
          test -f dpg_sim_export/index.html
          test -f dpg_sim_export/index.wasm
          test -f dpg_sim_export/index.pck

      - name: Prepare web game
        run: |
          mkdir -p output
          cp -r dpg_sim_export/. output/

      - name: Package web build
        uses: actions/upload-artifact@v4
        with:
          name: dpgsim-web-build
          path: output/
